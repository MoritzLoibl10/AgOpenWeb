name: Fork Test Pre-Release

# Fork-only: a manually started test build for one tablet/PC — Windows x64 zip + Android APK —
# published as a GitHub *pre-release* with free-form release notes. Kept separate from
# build-deploy-bundles.yml (unchanged from upstream) so rebasing on upstream stays conflict-free.
# The build steps mirror build-deploy-bundles.yml's `windows` and `android` jobs.
#
# Start: Actions → "Fork Test Pre-Release" → Run workflow (or the REST API), with
#   tag   — e.g. 26.7.0-moritz.1 (no leading "v": v* tags would also start the upstream release)
#   notes — release text (Markdown)
#
# Android signing is mandatory (repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD, key alias "agopenweb"); without them the run fails.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pre-release tag, e.g. 26.7.0-moritz.1 (no leading v)'
        required: true
      notes:
        description: 'Release text (Markdown)'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: ubuntu-latest   # cross-publishes win-x64 from Linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Windows launcher bundle (x64)
        run: ./deploy/windows/package.sh --arch x64 --out "$GITHUB_WORKSPACE/dist"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: agopenweb-win-x64
          path: dist/agopenweb-win-x64.zip
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Product name check
        run: |
          if grep -q '\[PRODUKTNAME\]' Platforms/AgOpenWeb.Android/Brand.cs; then
            echo "::warning::The product name is still the placeholder [PRODUKTNAME]."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install Android workload
        run: |
          for i in 1 2 3; do
            dotnet workload install android && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Restore dependencies
        run: dotnet restore Platforms/AgOpenWeb.Android/AgOpenWeb.Android.csproj

      # Release signing is required: the same key every build, so a new test version installs
      # over the old one without uninstalling. Secrets (Settings → Secrets and variables →
      # Actions): ANDROID_KEYSTORE_BASE64 (the keystore file, Base64) and
      # ANDROID_KEYSTORE_PASSWORD (store password = key password); key alias "agopenweb".
      # No fallback to a throw-away debug key: without the secrets the build stops here.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings → Secrets and variables → Actions (see the comment above this step). Not signing with a throw-away key."
            exit 1
          fi
          KS="$RUNNER_TEMP/agopenweb-release.keystore"
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64 of a keystore file."
            exit 1
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      # Wrong password / wrong alias give a clear message here instead of the SDK's opaque
      # "java exited with code 2". Passwords go via -storepass:env, never on a command line;
      # the output shows only alias names and certificate fingerprints.
      - name: Verify signing keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ steps.keystore.outputs.path }}"
          if ! keytool -list -keystore "$KS" -storepass:env KS_PASS > ks.txt 2>&1; then
            echo "::error::Cannot open the keystore: wrong ANDROID_KEYSTORE_PASSWORD, or ANDROID_KEYSTORE_BASE64 is not the keystore file."
            exit 1
          fi
          if ! keytool -list -v -keystore "$KS" -storepass:env KS_PASS -alias agopenweb > alias.txt 2>&1; then
            echo "::error::The keystore has no key with alias 'agopenweb'. Aliases found:"
            grep -i "alias" ks.txt || true
            exit 1
          fi
          grep -E "^(Alias name|Valid from)" alias.txt || true
          FP=$(grep -m1 -E "SHA256:" alias.txt | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          echo "Release key SHA-256: $FP"
          echo "KEY_SHA256=$FP" >> "$GITHUB_ENV"

      - name: Build Android APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish Platforms/AgOpenWeb.Android/AgOpenWeb.Android.csproj \
            -c Release -f net10.0-android -o publish/android \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}" \
            -p:AndroidSigningKeyAlias=agopenweb \
            -p:AndroidSigningStorePass=env:KS_PASS \
            -p:AndroidSigningKeyPass=env:KS_PASS

      - name: Collect signed APK
        run: |
          mkdir -p dist
          APK=$(find publish/android -type f -name "*-Signed.apk" | head -1)
          [ -n "$APK" ] || { echo "No signed APK found!"; exit 1; }
          cp "$APK" dist/agopenweb-android.apk

      # The APK must carry the release key, not a debug key.
      - name: Check APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found in \$ANDROID_HOME/build-tools."; exit 1; }
          "$APKSIGNER" verify --print-certs dist/agopenweb-android.apk > certs.txt
          APK_FP=$(grep -m1 "certificate SHA-256 digest:" certs.txt | sed 's/.*digest: *//' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256:  $APK_FP"
          if [ -z "$APK_FP" ] || [ "$APK_FP" != "$KEY_SHA256" ]; then
            echo "::error::The APK is not signed with the release key (expected $KEY_SHA256)."
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: agopenweb-android
          path: dist/agopenweb-android.apk
          retention-days: 14

  prerelease:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + pre-release
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) echo "::error::Use a tag without a leading v (v* tags start the upstream release workflow)."; exit 1 ;;
            *[!A-Za-z0-9._-]*|"") echo "::error::Tag may only contain letters, digits, '.', '_' and '-'."; exit 1 ;;
          esac

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
        # Fixed footer: licence and the exact source of these binaries (GPL v3 §6), also for
        # an APK passed on without the app's info page at hand.
        run: |
          printf '%s\n\n---\nLicence: GNU GPL v3 (text in the app under Setup → Info). Source code of this build: https://github.com/%s/tree/%s\n' \
            "$NOTES" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > notes.md

      - name: Publish pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          prerelease: true
          draft: false
          body_path: notes.md
          files: |
            dist/**/agopenweb-win-x64.zip
            dist/**/agopenweb-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
